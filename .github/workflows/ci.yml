name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-and-build:
    name: Resolve remote package and build (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve the remote package from GitHub
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj -scheme Demo
      - name: Show the resolved version
        run: find . -name Package.resolved -not -path "./build/*" -print -exec cat {} \;
      - name: Build for any iOS Simulator
        run: |
          xcodebuild build -project Demo.xcodeproj -scheme Demo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO

  run-on-simulator:
    name: Install, launch and screenshot on an iOS Simulator
    runs-on: macos-15
    needs: resolve-and-build
    # Only main ever gets screenshots committed back, so only main runs this.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build, install, launch (8 views) and screenshot
        run: bash Scripts/simulator-screenshots.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: Demo/Screenshots/*.png
      - name: Commit screenshots if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Demo/Screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Simulator screenshots from CI [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
